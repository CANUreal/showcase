name: Pushing backend to quay

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: login to quay
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: build docker image
        run: |
          docker build --file Dockerfile --tag quay.io/denizdayan/showcase:latest .

      - name: push docker image
        if: github.event_name == 'push'
        run: docker push quay.io/denizdayan/showcase:latest
        
