name: Pushing backend to quay

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: login to quay
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: build docker image
        if: github.event_name == 'push'
        run: |
          docker build --file Dockerfile --tag quay.io/showcase/showcase:${GITHUB_SHA} .

      - name: push docker image
        if: github.event_name == 'push'
        run: docker push quay.io/showcase/showcase:${GITHUB_SHA}
       
      - name: checkout gitops repo
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: CANUreal/showcase-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: update deployment image number
        if: github.event_name == 'push'
        run: |
          sed -i "s#image: quay.io/showcase/showcase:.*#image: quay.io/showcase/showcase:${GITHUB_SHA}#g" gitops/apps/showcase-backend/deployment.yaml
          
      - name: install kubeseal    
        if: github.event_name == 'push'
        run: |
          curl -OL "https://github.com/bitnami/sealed-secrets/releases/download/v0.39.1/kubeseal-0.39.1-linux-amd64.tar.gz"
          tar -xvzf kubeseal-0.39.1-linux-amd64.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal

      - name: seal secret using literals
        if: github.event_name == 'push'
        run: |
          kubectl create secret generic showcase-backend-secrets \
            --dry-run=client -o yaml \
            --namespace showcase \
            --from-literal=AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --from-literal=DATABASE_URL=${{ secrets.DATABASE_URL }} | \
            kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller --namespace showcase --format yaml > gitops/apps/showcase-backend/sealed-secret.yaml

      - name: commit and push gitops change
        if: github.event_name == 'push'
        run: |
          cd gitops

          git config user.name "actions[bot]"
          git config user.email "12332343+actions[bot]@users.noreply.github.com"

          git add apps/showcase-backend/deployment.yaml
          git add apps/showcase-backend/sealed-secret.yaml

          git commit -m "updated showcase-backend image to ${GITHUB_SHA} and sealed secret" || exit 0
          git push 
